# Builds a new NOTORYX Forge firmware pack whenever Meshtastic (Beta) or
# MeshCore publish new firmware, and points firmware/latest.json at it.
# Forge checks that file at start (when online) and offers the new pack.
name: Firmware pack

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if nothing changed upstream"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: firmware-pack
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Anything new upstream?
        id: up
        run: python3 -I tools/firmware_watch.py check >> "$GITHUB_OUTPUT"

      - name: Build the pack
        if: steps.up.outputs.changed == 'true' || inputs.force
        run: python3 -I tools/build_firmware_pack.py --out pack --zip NOTORYX-Forge-firmware-pack.zip

      - name: Publish it
        if: steps.up.outputs.changed == 'true' || inputs.force
        run: |
          set -euo pipefail
          id=$(python3 -c "import json; print(json.load(open('pack/manifest.json'))['id'])")
          tag="firmware-${id}"
          mt=$(python3 -c "import json; m=json.load(open('pack/manifest.json')); print(next(s['version'] for s in m['systems'] if s['system']=='meshtastic'))")
          mc=$(python3 -c "import json; m=json.load(open('pack/manifest.json')); print(next(s['version'] for s in m['systems'] if s['system']=='meshcore'))")
          sha256sum NOTORYX-Forge-firmware-pack.zip | sed 's/ .*//' > sha.txt
          echo "$(cat sha.txt)  NOTORYX-Forge-firmware-pack.zip" > SHA256SUMS
          notes="Firmware pack for NOTORYX Forge: Meshtastic ${mt} (Beta) and MeshCore ${mc}, unchanged copies of the official releases, with a checksum for every file.

          Forge offers this pack by itself when it's online (Firmware tab, or the banner at the top). To use it offline, download the zip and choose Firmware → Import pack.

          The pack's LICENSES/SOURCE.md links the exact firmware source. NOTORYX Forge isn't made by or affiliated with Meshtastic or MeshCore. Meshtastic® is a registered trademark of Meshtastic LLC."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" NOTORYX-Forge-firmware-pack.zip SHA256SUMS --clobber
          else
            gh release create "$tag" NOTORYX-Forge-firmware-pack.zip SHA256SUMS --prerelease --latest=false \
              --title "Firmware pack: Meshtastic ${mt}, MeshCore ${mc}" --notes "$notes"
          fi
          python3 -I tools/firmware_watch.py latest pack NOTORYX-Forge-firmware-pack.zip "$tag"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/latest.json
          git commit -m "Firmware pack: Meshtastic ${mt}, MeshCore ${mc}" || echo "latest.json unchanged"
          git push origin HEAD:main

      - name: Keep the newest three packs
        if: steps.up.outputs.changed == 'true' || inputs.force
        run: |
          gh release list --limit 200 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("firmware-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
